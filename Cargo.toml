[package]
name = "starcom"
version = "0.2.0"
description = "Session Terminal And Remote COMmander"
keywords = ["terminal", "tmux", "ssh"]
categories = ["command-line-utilities"]
license = "MIT"
repository = "https://github.com/navigato-rs/starcom"
authors = ["Dzmitry Malyshau"]
edition = "2024"
rust-version = "1.96"
default-run = "starcom"

[package.metadata.bundle]
name = "Starcom"
identifier = "com.starcom.app"
# PNGs only. cargo-bundle --bin uses [package.metadata.bundle.bin.starcom]
# below, not this table; keep both in sync. Do not list the Windows ICO:
# macOS image::open of a PNG-compressed ICO can abort or yield a 16px tile.
icon = [
    "etc/starcom.svg",
    "etc/macos/icon_16.png",
    "etc/macos/icon_32.png",
    "etc/macos/icon_64.png",
    "etc/macos/icon_128.png",
    "etc/macos/icon_256.png",
    "etc/macos/icon_512.png",
    "etc/macos/icon_512@2x.png",
]

# cargo-bundle --bin starcom ignores [package.metadata.bundle] and reads this.
[package.metadata.bundle.bin.starcom]
name = "Starcom"
identifier = "com.starcom.app"
icon = [
    "etc/starcom.svg",
    "etc/macos/icon_16.png",
    "etc/macos/icon_32.png",
    "etc/macos/icon_64.png",
    "etc/macos/icon_128.png",
    "etc/macos/icon_256.png",
    "etc/macos/icon_512.png",
    "etc/macos/icon_512@2x.png",
]

[[bin]]
name = "starcom-inspect"
path = "src/bin/starcom-inspect.rs"
required-features = ["ssh"]

[dependencies]
navigato-http = { version = "0.1.0", git = "https://github.com/navigato-rs/fileman", rev = "78ab35bc16a35ada85e88b69f062fca166c2aa34", optional = true }
navigato-support = { version = "0.1.0", git = "https://github.com/navigato-rs/fileman", rev = "78ab35bc16a35ada85e88b69f062fca166c2aa34", optional = true }
anyhow = "1.0"
alacritty_terminal = "0.26"
tmuxctl = { version = "=0.1.0", default-features = false }
sunset-client = { version = "0.1.0", git = "https://github.com/navigato-rs/sunset", rev = "65f8859e33c2e9c7a4ed97b950798c1dcc888787", optional = true }
sunset-sftp = { version = "0.2.0", git = "https://github.com/navigato-rs/sunset", rev = "65f8859e33c2e9c7a4ed97b950798c1dcc888787", default-features = false, features = ["long-paths-1024"], optional = true }
polling = { version = "3.11", optional = true }

blade-egui = { version = "0.8.1", git = "https://github.com/kvark/blade", rev = "f1fbf2a", optional = true }
blade-graphics = { version = "0.8.4", git = "https://github.com/kvark/blade", rev = "f1fbf2a", optional = true }
egui = { version = "0.34", optional = true }
egui-winit = { version = "0.34", default-features = false, features = ["clipboard", "wayland", "x11"], optional = true }
winit = { version = "0.30.5", optional = true }
png = { version = "0.18", optional = true }
log = { version = "0.4", optional = true }
env_logger = { version = "0.11", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
raw-window-handle = { version = "0.6", optional = true }
wayland-backend = { version = "0.3", default-features = false, features = ["client_system"], optional = true }
wayland-client = { version = "0.31", default-features = false, features = ["system"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", optional = true, features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[features]
default = ["ssh", "gui"]
gui = ["dep:navigato-support", "ssh", "dep:blade-egui", "dep:blade-graphics", "dep:egui", "dep:egui-winit", "dep:winit", "dep:png", "dep:log", "dep:env_logger", "dep:wayland-client", "dep:wayland-backend", "dep:raw-window-handle", "dep:windows-sys", "dep:polling"]
ssh = ["dep:sunset-client", "dep:sunset-sftp"]
tls-evaluation = ["dep:navigato-http"]

[package.metadata.deb]
maintainer = "Dzmitry Malyshau"
section = "utils"
assets = [
    ["target/release/starcom", "usr/bin/starcom", "755"],
    ["etc/starcom.desktop", "usr/share/applications/starcom.desktop", "644"],
    ["etc/starcom.svg", "usr/share/icons/hicolor/scalable/apps/starcom.svg", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/starcom", dest = "/usr/bin/starcom", mode = "755" },
    { source = "etc/starcom.desktop", dest = "/usr/share/applications/starcom.desktop", mode = "644" },
    { source = "etc/starcom.svg", dest = "/usr/share/icons/hicolor/scalable/apps/starcom.svg", mode = "644" },
]

[profile.release]
lto = "thin"
strip = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(gles)'] }

[[example]]
name = "tls-probe"
path = "examples/tls-probe.rs"
required-features = ["tls-evaluation"]
