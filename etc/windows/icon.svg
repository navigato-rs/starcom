<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Fluent mica tile. The chevrons and the cursor share the accent blue. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3e444c"/>
      <stop offset="1" stop-color="#1a1c20"/>
    </linearGradient>
    <linearGradient id="slab" gradientUnits="userSpaceOnUse" x1="0" y1="50" x2="0" y2="206">
      <stop offset="0" stop-color="#3397e2"/>
      <stop offset="1" stop-color="#2b8fdd"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="cast" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="5" stdDeviation="3" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <clipPath id="plate">
      <rect x="10" y="8" width="236" height="226" rx="44"/>
    </clipPath>
  </defs>
  <rect x="10" y="8" width="236" height="226" rx="44" fill="url(#bg)" filter="url(#shadow)"/>
  <g clip-path="url(#plate)">
    <rect x="10" y="8" width="236" height="48" fill="#fff" opacity="0.08"/>
    <g filter="url(#cast)">
  <path d="M36 70 L74 128 L36 186" fill="none" stroke="url(#slab)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M220 70 L182 128 L220 186" fill="none" stroke="url(#slab)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <rect x="110" y="110" width="36" height="36" rx="8" fill="url(#slab)"/>
  </g>
</svg>
